<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить работу</title>
    <link rel="stylesheet" href="/assets/styles/main.css">
    <link rel="stylesheet" href="/assets/styles/ui-kit.css">
</head>
<body>
    <!-- Auth Check -->
    <script type="module">
        import authService from '/modules/auth/infrastructure/auth.service.js';
        
        // Проверка авторизации
        if (!authService.isAuthenticated()) {
            window.location.href = '/modules/auth/presentation/pages/login.html';
        } else {
            // Добавить кнопку выхода
            const user = authService.getCurrentUser();
            const logoutBtn = document.createElement('button');
            logoutBtn.textContent = `🚪 Выход (${user.username})`;
            logoutBtn.className = 'logout-btn';
            logoutBtn.style.cssText = 'position: fixed; top: 20px; right: 20px; padding: 10px 20px; background: #e53e3e; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; z-index: 1000; transition: all 0.2s;';
            
            logoutBtn.addEventListener('click', () => {
                if (confirm('Вы уверены что хотите выйти?')) {
                    import('/modules/auth/application/use-cases/logout.use-case.js').then(module => {
                        new module.default().execute();
                    });
                }
            });
            
            document.body.appendChild(logoutBtn);
        }
    </script>

    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="logo">Добавить работу</h1>
                <nav class="nav">
                    <a href="/index.html" class="nav-link">Главная</a>
                    <a href="/modules/mentors/presentation/pages/mentors-list.html" class="nav-link">Менторы</a>
                    <a href="/modules/work-records/presentation/pages/view-works.html" class="nav-link">Мои работы</a>
                    <a href="/modules/work-records/presentation/pages/add-work.html" class="nav-link active">Добавить</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="card">
                <h2>Добавить запись о работе</h2>
                
                <form id="workForm" class="form">
                    <div class="form-group">
                        <label for="mentorId">Ментор *</label>
                        <select id="mentorId" name="mentorId" required>
                            <option value="">Загрузка...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Дата *</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="form-group">
                        <label for="hours">Количество часов *</label>
                        <input type="number" id="hours" name="hours" min="0.1" step="0.1" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Описание работы *</label>
                        <textarea id="description" name="description" rows="4" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="category">Категория *</label>
                        <select id="category" name="category" required>
                            <option value="mentoring">Менторство</option>
                            <option value="development">Разработка</option>
                            <option value="consulting">Консультация</option>
                            <option value="other">Другое</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="notes">Примечания</label>
                        <textarea id="notes" name="notes" rows="2"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-secondary" onclick="history.back()">Отмена</button>
                        <button type="submit" class="btn-primary">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script type="module">
        import AddWorkController from '../controllers/add-work.controller.js';
        
        const controller = new AddWorkController();
        controller.init();
    </script>
</body>
</html>
