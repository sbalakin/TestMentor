<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Koi Mentor System</title>
    <link rel="stylesheet" href="/assets/styles/main.css">
    <link rel="stylesheet" href="/assets/styles/ui-kit.css">
    <link rel="stylesheet" href="../styles/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🎓 Koi Mentor System</h1>
                <p>Войдите в систему</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="username">
                        <span class="label-icon">👤</span>
                        Имя пользователя
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required
                        placeholder="admin или mentor1"
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        <span class="label-icon">🔒</span>
                        Пароль
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        placeholder="Введите пароль"
                        autocomplete="current-password"
                    >
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <button type="submit" class="btn-primary" id="loginButton">
                    Войти
                </button>
            </form>

            <div class="auth-footer">
                <div class="test-accounts">
                    <p><strong>Тестовые учетные записи:</strong></p>
                    <div class="accounts-grid">
                        <div class="account-card">
                            <h4>👔 Руководитель</h4>
                            <p>admin / admin123</p>
                            <p>manager / manager123</p>
                        </div>
                        <div class="account-card">
                            <h4>🎓 Ментор</h4>
                            <p>mentor1 / mentor1123</p>
                            <p>mentor2 / mentor2123</p>
                            <p>mentor3 / mentor3123</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import LoginController from '../controllers/login.controller.js';
        
        const controller = new LoginController();
        controller.init();
    </script>
</body>
</html>
