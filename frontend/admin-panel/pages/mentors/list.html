<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список менторов</title>
    <link rel="stylesheet" href="/assets/styles/main.css">
    <link rel="stylesheet" href="/assets/styles/ui-kit.css">
</head>
<body>
    <!-- Auth Check -->
    <script type="module">
        import authService from '/modules/auth/infrastructure/auth.service.js';
        
        if (!authService.isAuthenticated()) {
            window.location.href = '/modules/auth/presentation/pages/login.html';
        } else {
            const user = authService.getCurrentUser();
            const logoutBtn = document.createElement('button');
            logoutBtn.textContent = `🚪 Выход (${user.username})`;
            logoutBtn.className = 'logout-btn';
            logoutBtn.style.cssText = 'position: fixed; top: 20px; right: 20px; padding: 10px 20px; background: #e53e3e; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; z-index: 1000;';
            
            logoutBtn.addEventListener('click', () => {
                if (confirm('Вы уверены что хотите выйти?')) {
                    import('/modules/auth/application/use-cases/logout.use-case.js').then(module => {
                        new module.default().execute();
                    });
                }
            });
            
            document.body.appendChild(logoutBtn);
        }
    </script>

    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="logo">🐟 KOI - Менторы</h1>
                <nav class="nav">
                    <a href="/admin-panel/index.html" class="nav-link">Дашборд</a>
                    <a href="/admin-panel/pages/mentors/list.html" class="nav-link active">Менторы</a>
                    <a href="/admin-panel/pages/works/list.html" class="nav-link">Записи работ</a>
                    <a href="/admin-panel/pages/reports/list.html" class="nav-link">Отчеты</a>
                    <a href="/admin-panel/pages/settings/index.html" class="nav-link">Настройки</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="page-header">
                <h1>Список менторов</h1>
                <button class="btn-primary" id="addMentorBtn" style="display: none;">+ Добавить ментора</button>
            </div>

            <!-- Filters -->
            <div class="filters" style="margin-bottom: 24px;">
                <select id="statusFilter" class="form-control" style="max-width: 200px;">
                    <option value="">Все статусы</option>
                    <option value="ACTIVE">Активные</option>
                    <option value="INACTIVE">Неактивные</option>
                </select>
                <input type="text" id="searchInput" placeholder="Поиск по имени или email..." class="form-control" style="max-width: 300px; margin-left: 12px;">
            </div>

            <!-- Mentors Grid -->
            <div id="mentorsGrid" class="mentors-grid">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
    </main>

    <style>
        .mentors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        .mentor-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .mentor-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .mentor-card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .mentor-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .mentor-name {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            margin: 0;
        }

        .mentor-specialization {
            color: #718096;
            font-size: 14px;
            margin-top: 4px;
        }

        .mentor-info {
            margin-top: 16px;
        }

        .mentor-info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .mentor-info-row:last-child {
            border-bottom: none;
        }

        .mentor-info-label {
            color: #718096;
            font-size: 14px;
        }

        .mentor-info-value {
            color: #2d3748;
            font-weight: 500;
            font-size: 14px;
        }

        .mentor-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .mentor-status.active {
            background: #c6f6d5;
            color: #22543d;
        }

        .mentor-status.inactive {
            background: #fed7d7;
            color: #742a2a;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
    </style>

    <script type="module">
        import api from '/core/shared/api.js';
        import authService from '/modules/auth/infrastructure/auth.service.js';

        let allMentors = [];

        async function loadMentors() {
            try {
                const mentors = await api.get('/mentors/');
                allMentors = mentors;
                
                // Проверка: если ментор видит не только себя - это ошибка
                const currentUser = authService.getCurrentUser();
                if (currentUser.role === 'MENTOR') {
                    // Ментор должен видеть ТОЛЬКО себя
                    const myMentors = mentors.filter(m => m.id === currentUser.mentor_id);
                    if (myMentors.length === 0) {
                        console.warn('[MentorsList] Ментор не найден в списке!');
                    }
                    allMentors = myMentors;
                    renderMentors(myMentors);
                } else {
                    renderMentors(mentors);
                }
            } catch (error) {
                console.error('Error loading mentors:', error);
                document.getElementById('mentorsGrid').innerHTML = '<div class="empty-state"><div class="empty-state-icon">❌</div><h3>Ошибка загрузки</h3><p>' + error.message + '</p></div>';
            }
        }

        function renderMentors(mentors) {
            const grid = document.getElementById('mentorsGrid');
            
            if (mentors.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👥</div><h3>Менторов не найдено</h3><p>Начните с добавления первого ментора</p></div>';
                return;
            }

            grid.innerHTML = mentors.map(mentor => {
                const initials = mentor.fullName.split(' ').map(n => n[0]).join('').substring(0, 2);
                const statusClass = mentor.status === 'ACTIVE' ? 'active' : 'inactive';
                const statusText = mentor.status === 'ACTIVE' ? 'Активен' : 'Неактивен';

                return `
                    <div class="mentor-card" data-mentor-id="${mentor.id}">
                        <div class="mentor-card-header">
                            <div class="mentor-avatar">${initials}</div>
                            <div>
                                <h3 class="mentor-name">${mentor.fullName}</h3>
                                <div class="mentor-specialization">${mentor.specialization}</div>
                            </div>
                        </div>
                        <div class="mentor-info">
                            <div class="mentor-info-row">
                                <span class="mentor-info-label">Email:</span>
                                <span class="mentor-info-value">${mentor.email}</span>
                            </div>
                            <div class="mentor-info-row">
                                <span class="mentor-info-label">Ставка:</span>
                                <span class="mentor-info-value">${mentor.hourlyRate} ₽/час</span>
                            </div>
                            <div class="mentor-info-row">
                                <span class="mentor-info-label">Статус:</span>
                                <span class="mentor-status ${statusClass}">${statusText}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Add click handlers
            document.querySelectorAll('.mentor-card').forEach(card => {
                card.addEventListener('click', () => {
                    const mentorId = card.dataset.mentorId;
                    window.location.href = `/admin-panel/pages/mentors/view.html?id=${mentorId}`;
                });
            });
        }

        function filterMentors() {
            const statusFilter = document.getElementById('statusFilter').value;
            const searchText = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allMentors;

            if (statusFilter) {
                filtered = filtered.filter(m => m.status === statusFilter);
            }

            if (searchText) {
                filtered = filtered.filter(m => 
                    m.fullName.toLowerCase().includes(searchText) ||
                    m.email.toLowerCase().includes(searchText)
                );
            }

            renderMentors(filtered);
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadMentors();

            // Show add button for managers
            if (authService.isManager()) {
                document.getElementById('addMentorBtn').style.display = 'block';
                document.getElementById('addMentorBtn').addEventListener('click', () => {
                    window.location.href = '/admin-panel/pages/mentors/create.html';
                });
            }

            // Filters
            document.getElementById('statusFilter').addEventListener('change', filterMentors);
            document.getElementById('searchInput').addEventListener('input', filterMentors);
        });
    </script>
</body>
</html>
