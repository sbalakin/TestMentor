<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет ментора - KOI</title>
    <link rel="stylesheet" href="/assets/styles/main.css">
    <link rel="stylesheet" href="/assets/styles/ui-kit.css">
    <link rel="stylesheet" href="/core/shared/theme.css">
    <style>
        .mentor-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 0;
            margin-bottom: 40px;
        }

        .mentor-profile {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .mentor-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 4px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
        }

        .mentor-info h1 {
            margin: 0 0 8px 0;
            font-size: 32px;
        }

        .mentor-info p {
            margin: 4px 0;
            opacity: 0.9;
        }

        .quick-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .quick-stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .quick-stat-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .quick-stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
        }

        .quick-stat-label {
            color: #718096;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 16px 32px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .action-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .action-btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .action-btn-secondary:hover {
            background: #f7fafc;
        }
    </style>
</head>
<body>
    <!-- Auth Check -->
    <script type="module">
        import authService from '/modules/auth/infrastructure/auth.service.js';
        
        if (!authService.isAuthenticated()) {
            window.location.href = '/login.html';
        } else if (!authService.isMentor()) {
            // Руководитель не должен видеть кабинет ментора
            window.location.href = '/admin-panel/index.html';
        } else {
            const user = authService.getCurrentUser();
            const logoutBtn = document.createElement('button');
            logoutBtn.textContent = `🚪 Выход`;
            logoutBtn.className = 'logout-btn';
            logoutBtn.style.cssText = 'position: fixed; top: 20px; right: 20px; padding: 10px 20px; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); color: white; border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; z-index: 1000;';
            
            logoutBtn.addEventListener('click', () => {
                if (confirm('Вы уверены что хотите выйти?')) {
                    import('/modules/auth/application/use-cases/logout.use-case.js').then(module => {
                        new module.default().execute();
                    });
                }
            });
            
            document.body.appendChild(logoutBtn);
        }
    </script>

    <!-- Header with Profile -->
    <header class="mentor-header">
        <div class="container">
            <div class="mentor-profile">
                <div class="mentor-avatar-large" id="mentorAvatar">
                    MM
                </div>
                <div class="mentor-info">
                    <h1 id="mentorName">Загрузка...</h1>
                    <p id="mentorSpecialization">Специализация</p>
                    <p id="mentorEmail">email@example.com</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Quick Stats -->
            <div class="quick-stats">
                <div class="quick-stat-card">
                    <div class="quick-stat-icon">📝</div>
                    <div class="quick-stat-value" id="totalWorks">0</div>
                    <div class="quick-stat-label">Всего записей</div>
                </div>
                <div class="quick-stat-card">
                    <div class="quick-stat-icon">⏱️</div>
                    <div class="quick-stat-value" id="totalHours">0</div>
                    <div class="quick-stat-label">Часов работы</div>
                </div>
                <div class="quick-stat-card">
                    <div class="quick-stat-icon">💰</div>
                    <div class="quick-stat-value" id="totalEarnings">0 ₽</div>
                    <div class="quick-stat-label">Заработано</div>
                </div>
                <div class="quick-stat-card">
                    <div class="quick-stat-icon">📅</div>
                    <div class="quick-stat-value" id="monthHours">0</div>
                    <div class="quick-stat-label">Часов в этом месяце</div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="action-btn action-btn-primary" onclick="window.location.href='/mentor-cabinet/pages/add-work.html'">
                    ➕ Добавить запись о работе
                </button>
                <button class="action-btn action-btn-secondary" onclick="window.location.href='/mentor-cabinet/pages/my-works.html'">
                    📋 Мои записи
                </button>
                <button class="action-btn action-btn-secondary" onclick="window.location.href='/mentor-cabinet/pages/my-profile.html'">
                    👤 Мой профиль
                </button>
            </div>

            <!-- Recent Works Section -->
            <div class="section-header">
                <h2>Последние записи о работе</h2>
                <a href="/mentor-cabinet/pages/my-works.html" class="link">Показать все →</a>
            </div>

            <div id="recentWorks" class="works-list">
                <div class="loading" style="text-align: center; padding: 40px; color: #718096;">
                    Загрузка...
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 KOI - Личный кабинет ментора</p>
        </div>
    </footer>

    <!-- Theme Script -->
    <script src="/core/shared/theme.js"></script>
    <script>
        // Создать кнопку переключения темы
        document.addEventListener('DOMContentLoaded', () => {
            window.themeManager.createToggleButton();
        });
    </script>

    <!-- Scripts -->
    <script type="module">
        import api from '/core/shared/api.js';
        import authService from '/modules/auth/infrastructure/auth.service.js';
        import formatters from '/core/shared/formatters.js';

        const user = authService.getCurrentUser();
        let mentorData = null;

        async function loadMentorData() {
            try {
                // Загрузить профиль ментора
                mentorData = await api.get(`/mentors/${user.mentor_id}`);
                
                // Отобразить профиль
                const initials = mentorData.fullName.split(' ').map(n => n[0]).join('').substring(0, 2);
                document.getElementById('mentorAvatar').textContent = initials;
                document.getElementById('mentorName').textContent = mentorData.fullName;
                document.getElementById('mentorSpecialization').textContent = mentorData.specialization;
                document.getElementById('mentorEmail').textContent = mentorData.email;

                // Загрузить записи о работе
                const works = await api.get(`/work-records/?mentor_id=${user.mentor_id}`);
                
                // Подсчитать статистику
                const totalHours = works.reduce((sum, work) => sum + work.hours, 0);
                const totalEarnings = totalHours * mentorData.hourlyRate;
                
                // Текущий месяц
                const currentMonth = new Date().getMonth();
                const currentYear = new Date().getFullYear();
                const monthWorks = works.filter(work => {
                    const workDate = new Date(work.workDate);
                    return workDate.getMonth() === currentMonth && workDate.getFullYear() === currentYear;
                });
                const monthHours = monthWorks.reduce((sum, work) => sum + work.hours, 0);

                // Обновить статистику
                document.getElementById('totalWorks').textContent = works.length;
                document.getElementById('totalHours').textContent = totalHours.toFixed(1);
                document.getElementById('totalEarnings').textContent = formatters.money(totalEarnings);
                document.getElementById('monthHours').textContent = monthHours.toFixed(1);

                // Показать последние 5 записей
                renderRecentWorks(works.slice(0, 5));

            } catch (error) {
                console.error('[Mentor Cabinet] Error loading data:', error);
                document.getElementById('recentWorks').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #e53e3e;">
                        <p>Ошибка загрузки данных: ${error.message}</p>
                    </div>
                `;
            }
        }

        function renderRecentWorks(works) {
            const container = document.getElementById('recentWorks');
            
            if (works.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px; background: white; border-radius: 12px;">
                        <div style="font-size: 64px; margin-bottom: 16px;">📝</div>
                        <h3>У вас пока нет записей</h3>
                        <p style="color: #718096; margin-bottom: 24px;">Добавьте первую запись о выполненной работе</p>
                        <button class="action-btn action-btn-primary" onclick="window.location.href='/mentor-cabinet/pages/add-work.html'">
                            ➕ Добавить запись
                        </button>
                    </div>
                `;
                return;
            }

            container.innerHTML = works.map(work => {
                const date = new Date(work.workDate).toLocaleDateString('ru-RU');
                const hours = work.hours.toFixed(1);
                const amount = (work.hours * mentorData.hourlyRate).toFixed(2);

                return `
                    <div class="work-card" style="background: white; padding: 20px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                            <div>
                                <div style="font-weight: 600; color: #2d3748; margin-bottom: 4px;">
                                    ${work.category}
                                </div>
                                <div style="color: #718096; font-size: 14px;">
                                    📅 ${date} • ⏱️ ${hours} ч • 💰 ${formatters.money(amount)}
                                </div>
                            </div>
                        </div>
                        <div style="color: #4a5568; font-size: 14px;">
                            ${work.description || 'Без описания'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', loadMentorData);
    </script>
</body>
</html>
